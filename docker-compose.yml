services:
  db:
    image: postgres:16
    container_name: jobs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobs_user
      POSTGRES_PASSWORD: jobs_password
      POSTGRES_DB: jobs_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: